<style>
  /* ===== Catalog table ===== */
  .cat-table { width:100%; border-collapse:collapse; font-size:13.5px; }
  .cat-table thead th {
    text-align:left; padding:9px 12px; background:var(--a-soft,#E8EFF9);
    border-bottom:2px solid var(--a-line,#e8e4dc); font-weight:600;
    color:var(--a-ink-2,#374151); font-size:12px; text-transform:uppercase; letter-spacing:.04em;
  }
  .cat-table tbody tr.cat-row { border-bottom:1px solid var(--a-line,#e8e4dc); }
  .cat-table tbody tr.cat-row:hover { background:var(--a-soft-bg,#FAF8F4); }
  .cat-table td { padding:9px 12px; vertical-align:middle; }

  .grad-dot { width:18px; height:18px; border-radius:50%; border:2px solid rgba(0,0,0,.08); flex-shrink:0; }
  .code-cell { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--a-ink-2,#374151); }
  .name-cell { max-width:260px; }
  .cat-badge { display:inline-block; padding:2px 8px; border-radius:5px; font-size:11px; font-weight:600; background:var(--a-soft,#E8EFF9); color:var(--a-ink-2,#374151); }
  .price-cell { font-family:'JetBrains Mono',monospace; font-size:12.5px; }
  .tag-cell .tag-pill {
    display:inline-block; padding:2px 8px; border-radius:5px; font-size:11px; font-weight:700;
    background:#e8f5e9; color:#2e7d32;
  }
  .tag-cell .tag-pill.tag-hot  { background:#fff3e0; color:#e65100; }
  .tag-cell .tag-pill.tag-sale { background:#fce4ec; color:#880e4f; }
  .tag-cell .tag-pill.tag-new  { background:#e3f2fd; color:#0d47a1; }
  .tag-cell .tag-pill.tag-green { background:#e8f5e9; color:#2e7d32; }

  /* ===== Edit accordion ===== */
  tr.cat-edit-row td { padding:0; }
  .cat-edit-panel {
    background:var(--a-soft-bg,#FAF8F4); border-top:2px solid var(--a-primary,#2D5DA1);
    border-bottom:2px solid var(--a-line,#e8e4dc); padding:20px 24px;
  }
  .cat-edit-panel h3 { margin:0 0 16px; font-size:14px; font-weight:700; color:var(--a-primary,#2D5DA1); }
  .cat-edit-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .cat-edit-grid.wide2 { grid-template-columns:1fr 1fr; }
  .cat-edit-grid.wide3 { grid-template-columns:1fr 1fr 1fr; }
  @media (max-width:900px){ .cat-edit-grid { grid-template-columns:1fr 1fr; } }
  @media (max-width:600px){ .cat-edit-grid { grid-template-columns:1fr; } }

  .ef { display:flex; flex-direction:column; gap:4px; }
  .ef label { font-size:11.5px; font-weight:600; color:var(--a-ink-2,#374151); }
  .ef input, .ef select, .ef textarea {
    padding:8px 10px; border:1px solid var(--a-line,#e8e4dc); border-radius:7px;
    font:13px Inter,sans-serif; background:#fff; color:var(--a-ink,#1F2937);
  }
  .ef input:focus, .ef select:focus { outline:none; border-color:var(--a-primary,#2D5DA1); box-shadow:0 0 0 3px rgba(45,93,161,.12); }
  .ef input[type="color"] { padding:3px 6px; height:36px; cursor:pointer; }

  .cat-edit-actions { display:flex; gap:10px; margin-top:16px; align-items:center; }
  .btn-del-product { background:#fee2e2; color:#991b1b; border:none; padding:8px 16px; border-radius:7px; font:500 13px Inter; cursor:pointer; }
  .btn-del-product:hover { background:#fecaca; }

  .adm-btn.sm { padding:6px 14px; font-size:13px; }

  /* ===== Empty state ===== */
  .cat-empty { text-align:center; padding:48px 24px; color:var(--a-ink-3,#6B7280); }
  .cat-empty i { font-size:32px; margin-bottom:12px; display:block; opacity:.4; }

  /* ===== Top toolbar ===== */
  .cat-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .cat-toolbar .cat-search {
    flex:1; max-width:320px; padding:8px 12px; border:1px solid var(--a-line,#e8e4dc);
    border-radius:8px; font:13.5px Inter,sans-serif;
  }
  .cat-toolbar .cat-search:focus { outline:none; border-color:var(--a-primary,#2D5DA1); }

  .cat-count { font-size:13px; color:var(--a-ink-3,#6B7280); margin-left:auto; }

  const VND = n => n ? Number(n).toLocaleString('vi-VN')+'₫' : '';
  const $ = id => document.getElementById(id);

  function toast(msg, type='ok'){
    const t = document.createElement('div');
    t.style.cssText = `position:fixed;bottom:24px;right:24px;background:${type==='ok'?'#16A34A':'#C0392B'};color:#fff;padding:12px 20px;border-radius:8px;z-index:9999;font:500 14px Inter;box-shadow:0 4px 12px rgba(0,0,0,.15)`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2800);
  }

  // ===== Tag class auto-map =====
  const TAG_CLS_MAP = {
    'HOT': 'tag-hot',
    'NEW': 'tag-new',
    '-15%': 'tag-sale',
    '-20%': 'tag-sale',
    '-10%': 'tag-sale',
    'SET': 'tag-green',
    'BEST': 'tag-green',
  };
  function clsForTag(tag){
    if (!tag) return 'tag-green';
    return TAG_CLS_MAP[tag] || (tag.startsWith('-') ? 'tag-sale' : 'tag-green');
  }

  // ===== Sync open form into state =====
  function syncOpenForm(){
    if (state.openIdx === null) return;
    const idx = state.openIdx;
    const p = state.items[idx];
    if (!p) return;
    const panel = document.getElementById('edit-panel-' + idx);
    if (!panel) return;
    const g = f => panel.querySelector('[data-f="'+f+'"]');
    const fv = f => { const el = g(f); return el ? el.value : ''; };
    p.name     = fv('name');
    p.code     = fv('code');
    p.category = fv('category');
    p.ingr     = fv('ingr');
    p.b1       = fv('b1');
    p.b2       = fv('b2');
    p.tag      = fv('tag') || null;
    p.cls      = clsForTag(p.tag);
    p.price    = Number(fv('price')) || 0;
    p.old      = fv('old') ? Number(fv('old')) : null;
    p.grad     = fv('grad') || '#63C1BB';
    p.imageUrl = fv('imageUrl') || '';
    p.gallery  = [0,1,2,3].map(i => fv('gallery'+i) || '');
    p.rating   = fv('rating');
    p.reviews  = fv('reviews');
    p.stock    = Number(fv('stock')) || 0;
  }

  // ===== Render table =====
  function render(){
    const q = ($('catSearch').value || '').toLowerCase();
    const body = $('catBody');
    if (!state.items.length){
      body.innerHTML = '<tr><td colspan="8" class="cat-empty"><i class="fa-solid fa-box-open"></i> Chưa có sản phẩm nào</td></tr>';
      $('catCount').textContent = '0 sản phẩm';
      return;
    }
    let rows = '';
    let shown = 0;
    state.items.forEach((p, idx) => {
      const match = !q || (p.name||'').toLowerCase().includes(q) || (p.code||'').toLowerCase().includes(q) || (p.ingr||'').toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q);
      if (!match) return;
      shown++;
      const isOpen = state.openIdx === idx;
      const tagCls = p.cls || 'tag-green';
      rows += `<tr class="cat-row" data-idx="${idx}">
        <td><span class="grad-dot" style="background:${esc(p.grad||'#63C1BB')};display:inline-block"></span></td>
        <td class="code-cell">${esc(p.code)}</td>
        <td class="name-cell">${esc(p.name)}</td>
        <td><span class="cat-badge">${esc(p.category)}</span></td>
        <td class="price-cell">${VND(p.price)}</td>
        <td class="tag-cell">${p.tag ? `<span class="tag-pill ${esc(tagCls)}">${esc(p.tag)}</span>` : '<span style="color:#ccc">—</span>'}</td>
        <td style="text-align:center;font-size:12.5px">${p.stock}</td>
        <td><button class="adm-btn sm" data-edit="${idx}"><i class="fa-solid fa-pen"></i> Sửa</button></td>
      </tr>`;
      if (isOpen){
        rows += `<tr class="cat-edit-row" id="edit-row-${idx}">
          <td colspan="8">
            <div class="cat-edit-panel" id="edit-panel-${idx}">
              <h3><i class="fa-solid fa-pen-to-square"></i> Chỉnh sửa: ${esc(p.code)} — ${esc(p.name)}</h3>
              <div class="cat-edit-grid">
                <div class="ef"><label>Tên sản phẩm</label><input data-f="name" value="${esc(p.name||'')}"/></div>
                <div class="ef"><label>Mã SKU (code)</label><input data-f="code" value="${esc(p.code||'')}"/></div>
                <div class="ef"><label>Danh mục</label><input data-f="category" value="${esc(p.category||'')}"/></div>
                <div class="ef"><label>Thành phần chính (ingr)</label><input data-f="ingr" value="${esc(p.ingr||'')}"/></div>
              </div>
              <div class="cat-edit-grid wide2" style="margin-top:10px">
                <div class="ef"><label>Bullet 1 (b1)</label><input data-f="b1" value="${esc(p.b1||'')}"/></div>
                <div class="ef"><label>Bullet 2 (b2)</label><input data-f="b2" value="${esc(p.b2||'')}"/></div>
              </div>
              <div class="cat-edit-grid" style="margin-top:10px">
                <div class="ef">
                  <label>Badge (tag)</label>
                  <select data-f="tag">
                    <option value="" ${!p.tag?'selected':''}>— Không có —</option>
                    <option value="HOT" ${p.tag==='HOT'?'selected':''}>HOT</option>
                    <option value="NEW" ${p.tag==='NEW'?'selected':''}>NEW</option>
                    <option value="-15%" ${p.tag==='-15%'?'selected':''}>&minus;15%</option>
                    <option value="-20%" ${p.tag==='-20%'?'selected':''}>&minus;20%</option>
                    <option value="-10%" ${p.tag==='-10%'?'selected':''}>&minus;10%</option>
                    <option value="BEST" ${p.tag==='BEST'?'selected':''}>BEST</option>
                    <option value="SET" ${p.tag==='SET'?'selected':''}>SET</option>
                  </select>
                </div>
                <div class="ef"><label>Giá hiện tại (VND)</label><input data-f="price" type="number" value="${p.price||0}"/></div>
                <div class="ef"><label>Giá gốc / giá cũ (old, để trống nếu không có)</label><input data-f="old" type="number" value="${p.old||''}"/></div>
                <div class="ef"><label>Màu gradient (grad — dùng khi không có ảnh)</label><input data-f="grad" type="color" value="${esc(p.grad||'#63C1BB')}"/></div>
              </div>
              <div class="cat-edit-grid wide3" style="margin-top:10px">
                <div class="ef"><label>Đánh giá (rating)</label><input data-f="rating" value="${esc(String(p.rating||'4.9'))}"/></div>
                <div class="ef"><label>Số lượt đánh giá (reviews)</label><input data-f="reviews" value="${esc(String(p.reviews||'0'))}"/></div>
                <div class="ef"><label>Tồn kho (stock)</label><input data-f="stock" type="number" value="${p.stock||0}"/></div>
              </div>
              <div style="margin-top:14px;padding:14px;background:#F0F6FF;border:1px solid #2D5DA1;border-radius:10px">
                <label style="font-size:12.5px;font-weight:600;color:#2D5DA1;display:block;margin-bottom:10px"><i class="fa-solid fa-image"></i> Hình ảnh sản phẩm</label>
                <div style="display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:start">
                  <div>
                    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
                      <label class="adm-btn primary sm" style="cursor:pointer;margin:0">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Chọn ảnh từ máy
                        <input type="file" accept="image/*" data-upload-img="${idx}" style="display:none"/>
                      </label>
                      ${p.imageUrl ? `<button type="button" class="adm-btn sm" data-clear-img="${idx}" style="margin:0"><i class="fa-solid fa-xmark"></i> Xoá ảnh</button>` : ''}
                      <span style="font-size:11px;color:#6B7280">hoặc</span>
                    </div>
                    <input data-f="imageUrl" type="url" value="${esc(p.imageUrl||'')}" placeholder="https://... (dán URL ảnh)" style="width:100%;padding:9px 12px;border:1px solid #c5d8ee;border-radius:7px;font:13px Inter"/>
                    <small style="display:block;margin-top:6px;color:#6B7280;font-size:11.5px">Upload ảnh thẳng từ máy hoặc dán URL. Để trống → dùng hình chai mặc định.</small>
                  </div>
                  <div style="width:120px;height:120px;border-radius:8px;background:#fff;border:1px dashed #c5d8ee;display:grid;place-items:center;overflow:hidden">
                    ${p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="" style="width:100%;height:100%;object-fit:contain" onerror="this.style.display='none';this.parentNode.innerHTML='<span style=\\'font-size:10px;color:#991b1b\\'>Lỗi tải ảnh</span>'"/>` : '<span style="font-size:10px;color:#9ca3af;text-align:center">Chưa có ảnh</span>'}
                  </div>
                </div>
              </div>
              <div style="margin-top:14px;padding:14px;background:#FFF7E6;border:1px solid #E0A800;border-radius:10px">
                <label style="font-size:12.5px;font-weight:600;color:#996600;display:block;margin-bottom:10px"><i class="fa-solid fa-images"></i> Thư viện ảnh phụ (4 ảnh hiển thị bên dưới ảnh chính trên trang chi tiết)</label>
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
                  ${[0,1,2,3].map(i => {
                    const g = (p.gallery && p.gallery[i]) || '';
                    return `<div style="background:#fff;padding:8px;border-radius:7px;border:1px solid #f0d97a">
                      <div style="aspect-ratio:1;border-radius:5px;background:#fafafa;border:1px dashed #ddd;display:grid;place-items:center;overflow:hidden;margin-bottom:6px">
                        ${g ? `<img src="${esc(g)}" alt="" style="width:100%;height:100%;object-fit:contain" onerror="this.style.display='none'"/>` : `<span style="font-size:10px;color:#bbb">Slot ${i+1}</span>`}
                      </div>
                      <label class="adm-btn sm" style="cursor:pointer;width:100%;justify-content:center;font-size:11.5px;padding:5px 8px">
                        <i class="fa-solid fa-upload"></i> Tải ảnh
                        <input type="file" accept="image/*" data-upload-gallery="${idx}" data-slot="${i}" style="display:none"/>
                      </label>
                      <input data-f="gallery${i}" type="url" value="${esc(g)}" placeholder="URL ảnh" style="width:100%;margin-top:4px;padding:5px 7px;border:1px solid #f0d97a;border-radius:5px;font:11px Inter"/>
                      ${g ? `<button type="button" class="btn-del-product" data-clear-gallery="${idx}" data-slot="${i}" style="width:100%;margin-top:4px;padding:4px 6px;font-size:11px"><i class="fa-solid fa-xmark"></i> Xoá</button>` : ''}
                    </div>`;
                  }).join('')}
                </div>
                <small style="display:block;margin-top:8px;color:#996600;font-size:11.5px">Mỗi ảnh tự nén ~25–80 KB. Slot trống → giữ ảnh SVG mặc định.</small>
              </div>
              <div class="cat-edit-actions">
                <button class="adm-btn primary sm" data-save-row="${idx}"><i class="fa-solid fa-check"></i> Xác nhận</button>
                <button class="adm-btn sm" data-close-row="${idx}"><i class="fa-solid fa-xmark"></i> Đóng</button>
                <button class="btn-del-product" data-del-product="${idx}"><i class="fa-solid fa-trash"></i> Xoá sản phẩm này</button>
              </div>
            </div>
          </td>
        </tr>`;
      }
    });
    if (!shown && q){
      rows = `<tr><td colspan="8" class="cat-empty"><i class="fa-solid fa-magnifying-glass"></i> Không tìm thấy sản phẩm nào phù hợp</td></tr>`;
    }
    body.innerHTML = rows;
    $('catCount').textContent = shown + ' / ' + state.items.length + ' sản phẩm';
  }

  // ===== Event delegation =====
  $('catBody').addEventListener('click', e => {
    const btn = e.target.closest('button[data-edit],button[data-save-row],button[data-close-row],button[data-del-product]');
    if (!btn) return;

    if (btn.dataset.edit != null){
      const idx = +btn.dataset.edit;
      syncOpenForm();
      state.openIdx = (state.openIdx === idx) ? null : idx;
      render();
      if (state.openIdx !== null){
        const row = document.getElementById('edit-row-' + state.openIdx);
        if (row) row.scrollIntoView({ behavior:'smooth', block:'nearest' });
      }
    }

    else if (btn.dataset.saveRow != null){
      syncOpenForm();
      state.openIdx = null;
      render();
      toast('Đã cập nhật sản phẩm — nhớ nhấn "Lưu tất cả" để lưu lên Firestore');
    }

    else if (btn.dataset.closeRow != null){
      syncOpenForm();
      state.openIdx = null;
      render();
    }

    else if (btn.dataset.delProduct != null){
      const idx = +btn.dataset.delProduct;
      const p = state.items[idx];
      if (!p) return;
      if (!confirm('Xoá sản phẩm "' + p.name + '"?\nHành động này không thể hoàn tác cho đến khi bạn tải lại trang.')){
        return;
      }
      state.items.splice(idx, 1);
      state.openIdx = null;
      render();
      toast('Đã xoá sản phẩm — nhớ nhấn "Lưu tất cả"');
    }
  });

  // Tag auto-set cls when tag select changes inside an open panel
  $('catBody').addEventListener('change', e => {
    if (e.target.dataset.f === 'tag'){
      // visual cls preview not strictly needed here; will be set on syncOpenForm
    }
    // ===== Image file upload (main) =====
    const fileInput = e.target.closest('input[data-upload-img]');
    if (fileInput && fileInput.files && fileInput.files[0]){
      const idx = +fileInput.dataset.uploadImg;
      handleImageUpload(fileInput.files[0], idx);
    }
    // ===== Gallery image upload =====
    const galleryInput = e.target.closest('input[data-upload-gallery]');
    if (galleryInput && galleryInput.files && galleryInput.files[0]){
      const idx = +galleryInput.dataset.uploadGallery;
      const slot = +galleryInput.dataset.slot;
      handleGalleryUpload(galleryInput.files[0], idx, slot);
    }
  });

  async function handleGalleryUpload(file, idx, slot){
    if (!file.type.startsWith('image/')){ toast('Vui lòng chọn file ảnh', 'err'); return; }
    toast('Đang nén ảnh gallery ' + (slot+1) + '...');
    try {
      let dataUrl = await compressImage(file, 720, 0.7);
      let q = 0.7;
      while (dataUrl.length > 70000 && q > 0.3){
        q -= 0.1;
        dataUrl = await compressImage(file, 640, q);
      }
      if (!Array.isArray(state.items[idx].gallery)) state.items[idx].gallery = ['','','',''];
      state.items[idx].gallery[slot] = dataUrl;
      const sizeKB = Math.round(dataUrl.length / 1024);
      toast('✓ Đã upload gallery ' + (slot+1) + ' (' + sizeKB + ' KB)');
      state.openIdx = idx;
      render();
    } catch(err){
      console.error(err);
      toast('Lỗi xử lý ảnh: ' + err.message, 'err');
    }
  }

  // ===== Image file upload (compress + inline base64) =====
  async function handleImageUpload(file, idx){
    if (!file.type.startsWith('image/')){ toast('Vui lòng chọn file ảnh', 'err'); return; }
    toast('Đang nén ảnh...');
    try {
      // Compress: resize max 800px, JPEG quality 0.7 (~25-50KB output)
      let dataUrl = await compressImage(file, 800, 0.7);
      // If still too big (>60KB), compress harder
      let q = 0.7;
      while (dataUrl.length > 80000 && q > 0.3){
        q -= 0.1;
        dataUrl = await compressImage(file, 720, q);
      }
      // Set imageUrl in form input (so syncOpenForm picks it up) AND state
      state.items[idx].imageUrl = dataUrl;
      const sizeKB = Math.round(dataUrl.length / 1024);
      toast('✓ Đã upload ảnh (' + sizeKB + ' KB)');
      state.openIdx = idx;
      render();
    } catch(err){
      console.error(err);
      toast('Lỗi xử lý ảnh: ' + err.message, 'err');
    }
  }

  function compressImage(file, maxSide, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const ratio = Math.min(maxSide / img.width, maxSide / img.height, 1);
          const w = Math.round(img.width * ratio);
          const h = Math.round(img.height * ratio);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('Không đọc được file ảnh'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('Không đọc được file'));
      reader.readAsDataURL(file);
    });
  }

  // Clear image button (main + gallery)
  $('catBody').addEventListener('click', e => {
    const clearBtn = e.target.closest('button[data-clear-img]');
    if (clearBtn){
      const idx = +clearBtn.dataset.clearImg;
      state.items[idx].imageUrl = '';
      state.openIdx = idx;
      render();
      toast('Đã xoá ảnh');
      return;
    }
    const clearG = e.target.closest('button[data-clear-gallery]');
    if (clearG){
      const idx = +clearG.dataset.clearGallery;
      const slot = +clearG.dataset.slot;
      if (Array.isArray(state.items[idx].gallery)) state.items[idx].gallery[slot] = '';
      state.openIdx = idx;
      render();
      toast('Đã xoá ảnh gallery ' + (slot+1));
    }
  });

  // Search
  $('catSearch').addEventListener('input', () => render());

  // ===== Add new product =====
  $('btnCatAdd').addEventListener('click', () => {
    syncOpenForm();
    const newProduct = {
      code: 'SKU-' + (state.items.length + 1),
      name: 'Sản phẩm mới',
      category: 'Chưa phân loại',
      ingr: '',
      b1: '',
      b2: '',
      tag: null,
      cls: 'tag-green',
      rating: '4.8',
      reviews: '0',
      price: 0,
      old: null,
      stock: 0,
      grad: '#63C1BB',
    };
    state.items.unshift(newProduct);
    state.openIdx = 0;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ===== Save / Load =====
  async function saveCatalog(){
    syncOpenForm();
    // Guard against Firestore 1MB doc limit (esp. with inline base64 images)
    const totalBytes = JSON.stringify(state.items).length;
    if (totalBytes > 900000){
      const sizeKB = Math.round(totalBytes / 1024);
      if (!confirm('Tổng dữ liệu catalog là ' + sizeKB + ' KB — gần vượt giới hạn 1024 KB của Firestore. Nếu lưu có thể bị lỗi. Tiếp tục?')) return;
    }
    try {
      if (window.DTX_FIREBASE?.enabled){
        const fb = window.DTX_FIREBASE;
        await fb.dbMethods.setDoc(
          fb.dbMethods.doc(fb.db, 'settings', 'catalog'),
          { items: state.items, updatedAt: fb.dbMethods.serverTimestamp() }
        );
        toast('Đã lưu catalog lên Firestore (' + state.items.length + ' sản phẩm · ' + Math.round(totalBytes/1024) + ' KB)');
      } else {
        localStorage.setItem('dtx_catalog', JSON.stringify(state.items));
        toast('Đã lưu vào localStorage (local mode)');
      }
    } catch(err){
      console.error(err);
      toast('Lỗi khi lưu: ' + err.message, 'err');
    }
  }

  async function loadCatalog(){
    try {
      if (window.DTX_FIREBASE?.enabled){
        const fb = window.DTX_FIREBASE;
        const snap = await fb.dbMethods.getDoc(fb.dbMethods.doc(fb.db, 'settings', 'catalog'));
        if (snap.exists()){
          const d = snap.data();
          state.items = d.items || [];
          toast('Đã tải catalog từ Firestore (' + state.items.length + ' sản phẩm)');
        } else {
          state.items = JSON.parse(JSON.stringify(DEFAULT_CATALOG.items));
        }
      } else {
        const ls = localStorage.getItem('dtx_catalog');
        state.items = ls ? JSON.parse(ls) : JSON.parse(JSON.stringify(DEFAULT_CATALOG.items));
      }
      state.openIdx = null;
      render();
    } catch(err){
      console.error(err);
      state.items = JSON.parse(JSON.stringify(DEFAULT_CATALOG.items));
      state.openIdx = null;
      render();
    }
  }

  $('btnCatSave').addEventListener('click', saveCatalog);
  $('btnCatReload').addEventListener('click', loadCatalog);
  $('btnCatReset').addEventListener('click', () => {
    if (confirm('Khôi phục về danh sách sản phẩm mặc định (34 SKUs)?\nCác thay đổi chưa lưu sẽ mất.')){
      state.items = JSON.parse(JSON.stringify(DEFAULT_CATALOG.items));
      state.openIdx = null;
      render();
    }
  });

  // ===== Initial load =====
  state.items = JSON.parse(JSON.stringify(DEFAULT_CATALOG.items));
  render();
  if (window.DTX_FIREBASE?.enabled){
    loadCatalog();
  } else {
    window.addEventListener('dtx:firebase-ready', loadCatalog, { once: true });
    setTimeout(loadCatalog, 100);
  }
})();
</script>
</body>
</html>
